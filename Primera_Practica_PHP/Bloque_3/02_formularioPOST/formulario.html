<!-- Ejercicio 2: Enviar datos ocultos con POST
Concepto: El método POST envía información (como contraseñas) sin mostrarla en la URL (a diferencia de GET).
Instrucción: Crea un formulario con método POST y recoge la clave en PHP. -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>

    <form action="datos.php" method="POST">
        
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <input type="submit" value="Enviar">

    </form>

</body>
</html>
